<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAKAMI TECH - Centro de Operações ASTRA-Net (Simulador MVP)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #fff; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(34, 211, 238, 0.2); }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Topbar -->
    <header class="bg-gray-900 border-b border-gray-800 p-4 flex justify-between items-center z-10">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="text-orange-500 font-black text-xl tracking-tighter">YAKAMI<span class="text-white">.TECH</span></a>
            <span class="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-full font-bold">🛰️ ASTRA-Net Ops Center (MVP)</span>
        </div>
        <div class="flex items-center space-x-4 text-sm">
            <div class="flex items-center space-x-2">
                <input type="checkbox" id="toggle-weather" class="accent-cyan-500" checked>
                <label for="toggle-weather" class="text-gray-300 text-xs">Radar Chuva</label>
            </div>
            <div class="flex items-center space-x-2">
                <input type="checkbox" id="toggle-hotspots" class="accent-orange-500" checked>
                <label for="toggle-hotspots" class="text-gray-300 text-xs">Focos Incêndio</label>
            </div>
            <a href="index.html" class="bg-gray-800 hover:bg-gray-700 px-4 py-1.5 rounded-lg text-xs font-bold transition-colors">Voltar ao Início</a>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex relative overflow-hidden">
        <!-- Mapa / Canvas Simulado -->
        <div class="flex-1 relative bg-gray-950 flex items-center justify-center overflow-hidden" id="map-container">
            <div class="absolute inset-0 opacity-35 bg-[radial-gradient(#1e293b_1px,transparent_1px)] [background-size:16px_16px]"></div>
            
            <!-- Camada de Simulação Fluvial (Rio Amazonas) -->
            <div class="absolute w-full h-40 bg-cyan-950/40 border-y border-cyan-800/30 transform rotate-[-5deg] flex items-center justify-around">
                <span class="text-cyan-500/30 font-black text-6xl uppercase tracking-widest">Calha do Rio Solimões / Amazonas</span>
            </div>

            <!-- Camadas Visuais Opcionais -->
            <div id="weather-layer" class="absolute inset-0 bg-blue-500/5 pointer-events-none transition-opacity"></div>
            <div id="hotspots-layer" class="absolute inset-0 pointer-events-none">
                <div class="absolute top-1/4 left-1/3 w-3 h-3 bg-orange-500 rounded-full animate-ping"></div>
                <div class="absolute bottom-1/3 right-1/4 w-3 h-3 bg-orange-500 rounded-full animate-ping"></div>
            </div>

            <!-- Contêiner Dinâmico de Embarcações e Satélite -->
            <div id="canvas-elements" class="absolute inset-0 pointer-events-auto"></div>
        </div>

        <!-- Sidebar de Telemetria e Governança -->
        <aside class="w-96 bg-gray-900 border-l border-gray-800 flex flex-col p-4 space-y-4 z-10 overflow-y-auto">
            
            <!-- Painel Orbital -->
            <div id="orbital-panel" class="glass-panel p-4 rounded-xl space-y-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-cyan-400 flex items-center"><i class="fas fa-satellite mr-2"></i> Status YAKAMI-SAT 1</h2>
                <div class="flex justify-between text-xs text-gray-300"><span>Órbita LEO:</span><span class="font-mono">600 km (25°)</span></div>
                <div class="flex justify-between text-xs text-gray-300"><span>Blockchain DePIN:</span><span class="text-green-400 font-bold">SYNC</span></div>
            </div>

            <!-- Painel de Telemetria da Embarcação Selecionada -->
            <div id="telemetry-panel" class="glass-panel p-4 rounded-xl space-y-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-orange-400 flex items-center"><i class="fas fa-ship mr-2"></i> Telemetria Fluvial</h2>
                <div id="telemetry-content" class="text-xs text-gray-400 space-y-1">
                    <p>Clique em uma embarcação no mapa para carregar dados em tempo real (Norma 204).</p>
                </div>
            </div>

            <!-- Painel de Alertas e Logs -->
            <div id="alerts-panel" class="glass-panel p-4 rounded-xl flex-1 flex flex-col">
                <h2 class="text-xs font-bold uppercase tracking-wider text-cyan-400 mb-2 flex items-center"><i class="fas fa-bell mr-2"></i> Centro de Alertas</h2>
                <div id="alerts-list" class="flex-1 overflow-y-auto space-y-1.5 text-[11px] font-mono text-gray-300 pr-1"></div>
            </div>
        </aside>
    </div>

    <!-- Script de Execução do Simulador MVP -->
    <script>
        // Variáveis globais do sistema
        let embarcacoes = [];
        let selectedVesselId = null;
        let alerts = [];

        function addAlert(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            alerts.unshift({ timestamp, type, message });
            if (alerts.length > 50) alerts.pop();
            updateAlertsPanel();
        }

        function updateAlertsPanel() {
            const listEl = document.getElementById('alerts-list');
            if (!listEl) return;
            listEl.innerHTML = alerts.map(a => `<div class="border-b border-gray-800/50 pb-1"><span class="text-gray-500">[${a.timestamp}]</span> <b class="text-cyan-400">${a.type}:</b> ${a.message}</div>`).join('');
        }

        function generateFleet() {
            embarcacoes = [
                { id: 'v1', name: 'Ferry Boat Rosa de Saron', x: 20, y: 45, speed: '12 nós', status: 'Conforme Norma 204' },
                { id: 'v2', name: 'Barcaça Logística Solimões', x: 50, y: 55, speed: '8 nós', status: 'Monitorado por Satélite' },
                { id: 'v3', name: 'Embarcação Extrativista RDS', x: 75, y: 35, speed: '6 nós', status: 'Selo Bioeconomia Ativo' }
            ];
        }

        function selectVessel(id) {
            selectedVesselId = id;
            const vessel = embarcacoes.find(e => e.id === id);
            if (vessel) {
                updateTelemetryPanel(vessel);
                addAlert('SELEÇÃO', `Monitorando embarcação: ${vessel.name}`);
            }
        }

        function updateTelemetryPanel(vessel) {
            const content = document.getElementById('telemetry-content');
            if (!vessel) {
                content.innerHTML = `<p class="text-gray-400">Nenhuma embarcação selecionada.</p>`;
                return;
            }
            content.innerHTML = `
                <p><b>Nome:</b> ${vessel.name}</p>
                <p><b>Velocidade:</b> ${vessel.speed}</p>
                <p><b>Status:</b> <span class="text-green-400 font-bold">${vessel.status}</span></p>
                <p><b>Criptografia PUF:</b> <span class="text-cyan-400">Ativa (Hardware S/N)</span></p>
                <button onclick="alert('SOS Acionado via Satélite! Alerta enviado à Capitania dos Portos.')" class="mt-2 w-full bg-red-600 hover:bg-red-500 text-white font-bold py-1 rounded text-[10px] uppercase">Emitir SOS / Alerta Fluvial</button>
            `;
        }

        function updateOrbitalPanel() {
            // Atualizações orbitais
        }

        function updateVesselPositions() {
            embarcacoes.forEach(v => {
                v.x = (v.x + 0.1) % 100;
            });
        }

        function renderDynamicElements() {
            const container = document.getElementById('canvas-elements');
            if (!container) return;
            container.innerHTML = embarcacoes.map(v => `
                <div onclick="selectVessel('${v.id}')" class="absolute cursor-pointer transform -translate-x-1/2 -translate-y-1/2 group" style="left: ${v.x}%; top: ${v.y}%;">
                    <div class="w-6 h-6 bg-cyan-500/20 border-2 border-cyan-400 rounded-full flex items-center justify-center shadow-lg shadow-cyan-500/50 hover:scale-125 transition-transform">
                        <i class="fas fa-ship text-cyan-300 text-[10px]"></i>
                    </div>
                    <span class="absolute left-8 top-0 bg-gray-900/90 text-[10px] px-2 py-0.5 rounded border border-gray-700 whitespace-hidden group-hover:whitespace-normal">${v.name}</span>
                </div>
            `).join('');
        }

        // ==============================================
        // 11. MELHORIAS DE ACESSIBILIDADE E PERFORMANCE
        // ==============================================
        document.querySelectorAll('button[onclick]').forEach(btn => {
            if (!btn.hasAttribute('aria-label')) {
                btn.setAttribute('aria-label', btn.textContent.trim());
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                selectedVesselId = null;
                updateTelemetryPanel(null);
                renderDynamicElements();
            }
            if (e.key === 'ArrowDown' && embarcacoes.length > 0) {
                const idx = embarcacoes.findIndex(e => e.id === selectedVesselId);
                const nextIdx = (idx + 1) % embarcacoes.length;
                selectVessel(embarcacoes[nextIdx].id);
            }
        });

        let lastUpdate = 0;
        function gameLoop(timestamp) {
            if (timestamp - lastUpdate >= 150) {
                updateVesselPositions();
                renderDynamicElements();
                if (selectedVesselId) {
                    const vessel = embarcacoes.find(e => e.id === selectedVesselId);
                    if (vessel) updateTelemetryPanel(vessel);
                }
                lastUpdate = timestamp;
            }
            requestAnimationFrame(gameLoop);
        }
        requestAnimationFrame(gameLoop);

        setTimeout(() => {
            const oldStatus = document.querySelector('#orbital-panel .flex.justify-between:last-child span:last-child');
            if (oldStatus) {
                oldStatus.className = 'text-green-400 font-bold';
                oldStatus.textContent = 'SYNC';
            }
        }, 2000);

        window.exportLogs = function() {
            if (alerts.length === 0) {
                addAlert('SISTEMA', 'Nenhum log para exportar.');
                return;
            }
            const headers = 'Timestamp,Tipo,Mensagem\n';
            const rows = alerts.map(a => `${a.timestamp},${a.type},"${a.message.replace(/"/g, '""')}"`).join('\n');
            const csv = headers + rows;
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `astra-logs-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            addAlert('✅ EXPORT', 'Logs exportados para CSV.');
        };

        const exportBtn = document.createElement('button');
        exportBtn.textContent = '📥 Exportar Logs';
        exportBtn.className = 'w-full mt-2 bg-cyan-600/20 border border-cyan-600 text-cyan-400 font-bold py-1 rounded text-[10px] hover:bg-cyan-600 hover:text-white transition-all';
        exportBtn.onclick = exportLogs;
        exportBtn.setAttribute('aria-label', 'Exportar logs do sistema para CSV');
        const alertsTitle = document.querySelector('#alerts-panel h2');
        if (alertsTitle) {
            alertsTitle.parentNode.insertBefore(exportBtn, alertsTitle.nextSibling);
        }

        // ==============================================
        // 12. INICIALIZAÇÃO FINAL
        // ==============================================
        generateFleet();
        updateTelemetryPanel(null);
        updateAlertsPanel();
        updateOrbitalPanel();
        addAlert('SISTEMA', 'Centro de Operações ASTRA-Net inicializado.');
        renderDynamicElements();

        document.getElementById('toggle-weather')?.addEventListener('change', (e) => {
            document.getElementById('weather-layer')?.classList.toggle('hidden', !e.target.checked);
            addAlert('CAMADAS', `Radar de precipitação ${e.target.checked ? 'ATIVADO' : 'DESATIVADO'}`);
        });
        document.getElementById('toggle-hotspots')?.addEventListener('change', (e) => {
            document.getElementById('hotspots-layer')?.classList.toggle('hidden', !e.target.checked);
            addAlert('CAMADAS', `Focos de incêndio ${e.target.checked ? 'ATIVADOS' : 'DESATIVADOS'}`);
        });

        console.log('🛰️ ASTRA-Net Simulator Ready');
    </script>
</body>
</html>
