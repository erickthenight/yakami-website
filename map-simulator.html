<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAKAMI TECH - Centro de Operações ASTRA-Net (Simulador MVP)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #070b14; color: #fff; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(34, 211, 238, 0.3); box-shadow: 0 0 15px rgba(34, 211, 238, 0.05); }
        #map { width: 100%; height: 100%; background: #070b14; }
        /* Filtro CSS profissional para transformar o mapa padrão em um Mapa Tático Escuro sem API Key */
        .leaflet-tile-pane {
            filter: invert(100%) hue-rotate(180deg) brightness(90%) contrast(95%);
        }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Topbar -->
    <header class="bg-gray-900 border-b border-gray-800 px-6 py-3 flex justify-between items-center z-20 shadow-xl">
        <div class="flex items-center space-x-4">
            <a href="index.html" class="text-orange-500 font-black text-xl tracking-tighter">YAKAMI<span class="text-white">.TECH</span></a>
            <span class="text-xs bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 px-3 py-1 rounded-full font-bold uppercase tracking-wider">🛰️ ASTRA-Net GIS Ops Center (MVP)</span>
        </div>
        <div class="flex items-center space-x-6 text-sm">
            <div class="flex items-center space-x-2 bg-gray-800/60 px-3 py-1.5 rounded-lg border border-gray-700">
                <input type="checkbox" id="toggle-weather" class="accent-cyan-500 w-4 h-4 cursor-pointer" checked>
                <label for="toggle-weather" class="text-gray-300 text-xs font-semibold cursor-pointer">Camada Hídrica / ANA</label>
            </div>
            <a href="index.html" class="bg-gradient-to-r from-cyan-600 to-cyan-500 hover:from-cyan-500 hover:to-cyan-400 px-4 py-2 rounded-lg text-xs font-bold text-gray-950 transition-all shadow-lg shadow-cyan-500/20">Voltar ao Início</a>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex relative overflow-hidden">
        
        <!-- Contêiner do Mapa Real -->
        <div class="flex-1 relative bg-gray-950" id="map-container">
            <div id="map" class="absolute inset-0 z-0"></div>
        </div>

        <!-- Sidebar de Telemetria e Governança -->
        <aside class="w-96 bg-gray-900 border-l border-gray-800 flex flex-col p-5 space-y-4 z-20 shadow-2xl overflow-y-auto">
            
            <!-- Painel Orbital -->
            <div id="orbital-panel" class="glass-panel p-4 rounded-xl space-y-2 border-l-4 border-l-cyan-400">
                <h2 class="text-xs font-black uppercase tracking-wider text-cyan-400 flex items-center"><i class="fas fa-satellite mr-2"></i> Status YAKAMI-SAT 1</h2>
                <div class="flex justify-between text-xs text-gray-300 pt-1"><span>Órbita LEO:</span><span class="font-mono font-bold text-white">600 km (25°)</span></div>
                <div class="flex justify-between text-xs text-gray-300"><span>Blockchain DePIN:</span><span class="text-green-400 font-bold bg-green-950/50 px-2 py-0.5 rounded border border-green-800/50">SYNC</span></div>
            </div>

            <!-- Painel de Telemetria -->
            <div id="telemetry-panel" class="glass-panel p-4 rounded-xl space-y-2 border-l-4 border-l-orange-500">
                <h2 class="text-xs font-black uppercase tracking-wider text-orange-400 flex items-center"><i class="fas fa-ship mr-2"></i> Telemetria Fluvial (Norma 204)</h2>
                <div id="telemetry-content" class="text-xs text-gray-300 space-y-1.5 pt-1">
                    <p class="text-gray-400 italic">Selecione uma embarcação no mapa para carregar os dados de rastreio em tempo real.</p>
                </div>
            </div>

            <!-- Painel de Alertas -->
            <div id="alerts-panel" class="glass-panel p-4 rounded-xl flex-1 flex flex-col border-l-4 border-l-cyan-600">
                <h2 class="text-xs font-black uppercase tracking-wider text-cyan-400 mb-2 flex items-center justify-between">
                    <span><i class="fas fa-bell mr-2"></i> Centro de Alertas</span>
                    <span class="text-[10px] text-gray-500 font-normal">Auditoria Automática</span>
                </h2>
                <div id="alerts-list" class="flex-1 overflow-y-auto space-y-1.5 text-[11px] font-mono text-gray-300 pr-1 max-h-56"></div>
            </div>
        </aside>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        const map = L.map('map', {
            zoomControl: false
        }).setView([-3.1190, -60.0217], 10);

        L.control.zoom({ position: 'topleft' }).addTo(map);

        // Camada padrão OpenStreetMap com tratamento visual tático escuro automático
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let embarcacoes = [
            { id: 'v1', name: 'Ferry Boat Rosa de Saron', lat: -3.145, lng: -60.120, speed: '12 nós', status: 'Conforme Norma 204', cargo: 'Passageiros / Carga Geral' },
            { id: 'v2', name: 'Barcaça Logística Solimões', lat: -3.200, lng: -59.950, speed: '8 nós', status: 'Monitorado por Satélite', cargo: 'Insumos Industriais PIM' },
            { id: 'v3', name: 'Embarcação Extrativista RDS', lat: -3.050, lng: -60.250, speed: '6 nós', status: 'Selo Bioeconomia Ativo', cargo: 'Sociobiodiversidade (Açaí/Castanha)' }
        ];

        let selectedVesselId = null;
        let alerts = [];
        let markers = {};

        function addAlert(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            alerts.unshift({ timestamp, type, message });
            if (alerts.length > 50) alerts.pop();
            updateAlertsPanel();
        }

        function updateAlertsPanel() {
            const listEl = document.getElementById('alerts-list');
            if (!listEl) return;
            listEl.innerHTML = alerts.map(a => `<div class="border-b border-gray-800/60 pb-1.5 flex items-start space-x-1"><span class="text-gray-500">[${a.timestamp}]</span> <b class="text-cyan-400">${a.type}:</b> <span class="text-gray-300">${a.message}</span></div>`).join('');
        }

        function selectVessel(id) {
            selectedVesselId = id;
            const vessel = embarcacoes.find(e => e.id === id);
            if (vessel) {
                updateTelemetryPanel(vessel);
                addAlert('SELEÇÃO', `Alvo rastreado: ${vessel.name}`);
                map.setView([vessel.lat, vessel.lng], 12, { animate: true });
            }
        }

        function updateTelemetryPanel(vessel) {
            const content = document.getElementById('telemetry-content');
            if (!vessel) {
                content.innerHTML = `<p class="text-gray-400 italic">Nenhuma embarcação selecionada.</p>`;
                return;
            }
            content.innerHTML = `
                <div class="bg-gray-950/60 p-2.5 rounded-lg border border-gray-800 space-y-1">
                    <p><b>Embarcação:</b> <span class="text-white">${vessel.name}</span></p>
                    <p><b>Carga:</b> <span class="text-gray-300">${vessel.cargo}</span></p>
                    <p><b>Velocidade:</b> <span class="font-mono text-cyan-400">${vessel.speed}</span></p>
                    <p><b>Compliance:</b> <span class="text-green-400 font-bold">${vessel.status}</span></p>
                    <p><b>Criptografia PUF:</b> <span class="text-cyan-400">Ativa (Hardware S/N)</span></p>
                </div>
                <button onclick="alert('SOS Acionado via Satélite! Alerta transmitido diretamente à Capitania dos Portos.')" class="mt-2 w-full bg-gradient-to-r from-red-700 to-red-600 hover:from-red-600 hover:to-red-500 text-white font-bold py-2 px-3 rounded-lg text-xs uppercase tracking-wider transition-all shadow-lg shadow-red-900/40 flex items-center justify-center space-x-2">
                    <i class="fas fa-satellite-dish"></i> <span>Emitir SOS / Alerta Fluvial</span>
                </button>
            `;
        }

        function renderMarkers() {
            embarcacoes.forEach(v => {
                const customIcon = L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div style="background-color: #0891b2; border: 2px solid #22d3ee; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(34,211,238,0.7);"><i class="fas fa-ship text-white text-xs"></i></div>`,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                if (!markers[v.id]) {
                    markers[v.id] = L.marker([v.lat, v.lng], { icon: customIcon }).addTo(map);
                    markers[v.id].on('click', () => selectVessel(v.id));
                    markers[v.id].bindTooltip(`<b>${v.name}</b><br>Status: ${v.status}`, { direction: 'top', offset: [0, -10] });
                } else {
                    markers[v.id].setLatLng([v.lat, v.lng]);
                }
            });
        }

        setInterval(() => {
            embarcacoes.forEach(v => {
                v.lng += (Math.random() - 0.5) * 0.002;
                v.lat += (Math.random() - 0.5) * 0.001;
            });
            renderMarkers();
        }, 3000);

        window.exportLogs = function() {
            if (alerts.length === 0) {
                addAlert('SISTEMA', 'Nenhum log para exportar.');
                return;
            }
            const headers = 'Timestamp,Tipo,Mensagem\n';
            const rows = alerts.map(a => `${a.timestamp},${a.type},"${a.message.replace(/"/g, '""')}"`).join('\n');
            const blob = new Blob([headers + rows], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `yakami-astra-logs-${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            addAlert('✅ EXPORT', 'Logs de auditoria exportados para CSV.');
        };

        const exportBtn = document.createElement('button');
        exportBtn.innerHTML = '<i class="fas fa-download mr-1"></i> Exportar Logs (CSV)';
        exportBtn.className = 'w-full mt-2 bg-cyan-600/20 border border-cyan-500/50 text-cyan-300 font-bold py-2 px-3 rounded-lg text-xs hover:bg-cyan-600 hover:text-white transition-all shadow-md';
        exportBtn.onclick = exportLogs;
        const alertsTitle = document.querySelector('#alerts-panel h2');
        if (alertsTitle) {
            alertsTitle.parentNode.insertBefore(exportBtn, alertsTitle.nextSibling);
        }

        renderMarkers();
        addAlert('SISTEMA', 'Centro de Operações ASTRA-Net GIS inicializado.');
    </script>
</body>
</html>
